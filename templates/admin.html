<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>

/* BODY */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#1e3c72,#ff7e5f);
    color: white;
}

/* CONTAINER */
.container {
    width: 85%;
    margin: auto;
    padding-top: 40px;
}

/* NAVBAR */
.nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
    background: rgba(255,255,255,0.15);
    border-radius: 15px;
}

/* TITLE */
.nav h2 {
    margin: 0;
}

/* LOGOUT BUTTON */
.logout {
    text-decoration: none;
    color: white;
    background: #ff4b5c;
    padding: 8px 18px;
    border-radius: 20px;
    font-weight: bold;
    transition: 0.3s;
}

.logout:hover {
    background: #ff1f3d;
}

/* CENTER SYSTEM INFO */
.dashboard {
    display: flex;
    justify-content: center;
    margin-top: 50px;
}

/* SYSTEM CARD */
.card {
    width: 500px;
    padding: 40px;
    text-align: center;

    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);

    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* TEXT */
.card h3 {
    margin-bottom: 20px;
    font-size: 26px;
}

.card p {
    font-size: 18px;
    line-height: 1.6;
}

/* FEATURE CARDS */
.features {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 50px;
}

/* SMALL CARDS */
.feature-card {
    width: 250px;
    text-align: center;
    padding: 25px;

    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);

    border-radius: 20px;
    transition: 0.3s;
}

.feature-card:hover {
    transform: translateY(-5px);
}

/* ICON */
.feature-card img {
    width: 70px;
    margin-bottom: 15px;
}

/* TITLE */
.feature-card h3 {
    margin-bottom: 15px;
}

/* BUTTON */
.feature-card a {
    text-decoration: none;
    color: white;
    background: #6a11cb;
    padding: 8px 15px;
    border-radius: 10px;
    display: inline-block;
}

.feature-card a:hover {
    background: #4b0fa5;
}

</style>
</head>

<body>

<div class="container">

    <!-- NAVBAR -->
    <div class="nav">
        <h2>Admin Dashboard</h2>
        <a href="/logout" class="logout">Logout</a>
    </div>

    <!-- SYSTEM INFO -->
    <div class="dashboard">
        <div class="card">
            <h3>System Info</h3>
            <p>Welcome Admin: <b>{{user}}</b></p>
            <p>MediBlock Blockchain Healthcare System Running</p>
            <p>You can monitor activity from Doctor & Patient panels.</p>
        </div>
    </div>

    <!-- FEATURE CARDS -->
    

</div>

</body>
</html>
