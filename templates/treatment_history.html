<!DOCTYPE html>
<html>
<head>

<title>Treatment History</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="staff-bg">

<div class="topbar">

<div class="logo">
🏥 MediBlock
</div>

<div class="logout">
<a href="/doctor">Back</a>
</div>

</div>

<h2 class="dashboard-title">Treatment History</h2>

<table border="1" style="width:80%;margin:auto;background:white;text-align:center">

<tr>
<th>Patient ID</th>
<th>Doctor</th>
<th>Hash Key</th>
</tr>

{% for t in blocks %}

<tr>

<td>{{ t.patient_id }}</td>
<td>{{ t.doctor }}</td>
<td>{{ t.hash_key }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
