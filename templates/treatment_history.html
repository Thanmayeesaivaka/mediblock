<!DOCTYPE html>
<html>
<head>
<title>Treatment History</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="staff-bg">

<div class="topbar">
<div class="logo">🏥 MediBlock</div>
<div class="logout">
<a href="/staff_home">Back</a>
</div>
</div>

<h2 class="dashboard-title">Treatment History</h2>

<table border="1" style="width:80%;margin:auto;background:white;text-align:center">

<tr>
<th>Patient ID</th>
<th>Treatment</th>
<th>Date</th>
</tr>

{% for row in history %}
<tr>
<td>{{row[0]}}</td>
<td>{{row[1]}}</td>
<td>{{row[2]}}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
