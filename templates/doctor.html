<!DOCTYPE html>
<html>
<head>
    <title>Doctor Dashboard - MediBlock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="gradient-bg">

    <div class="header">
        <h1>🏥 MediBlock</h1>
        <a href="/logout" class="logout">Logout</a>
    </div>

    <div class="content">

        <h2>Doctor Dashboard</h2>

        <!-- Add Record -->
        <form method="POST" class="record-form">

            <input type="text" name="patient" placeholder="Patient Username" required>
            <input type="text" name="diagnosis" placeholder="Diagnosis" required>
            <input type="text" name="prescription" placeholder="Prescription" required>

            <button type="submit">Add Record</button>

        </form>

        <!-- Records -->
        <div class="records-container">

            {% for block in blocks %}
            <div class="record-box">
                <p><strong>Patient:</strong> {{ block.patient }}</p>
                <p><strong>Doctor:</strong> {{ block.doctor }}</p>
                <p><strong>Diagnosis:</strong> {{ block.diagnosis }}</p>
                <p><strong>Prescription:</strong> {{ block.prescription }}</p>
                <p class="timestamp">{{ block.timestamp }}</p>
            </div>
            {% endfor %}

        </div>

    </div>

</div>

</body>
</html>
