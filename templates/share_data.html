<!DOCTYPE html>
<html>
<head>
<title>Share Patient Data</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

.form-box{
width:40%;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
}

button{
background:#1976d2;
color:white;
border:none;
padding:10px;
width:100%;
cursor:pointer;
}

.success{
color:green;
text-align:center;
}

</style>

</head>

<body class="staff-bg">

<div class="topbar">

<div class="logo">
🏥 MediBlock
</div>

<div class="logout">
<a href="/doctor">Back</a>
</div>

</div>


<h2 class="dashboard-title">Share Patient Data</h2>


<div class="form-box">

<form method="POST">

<label>Patient ID</label>

<input type="text" name="patient" required>


<label>Share With</label>

<select name="receiver">

<option value="doctor">Doctor</option>

<option value="insurance">Insurance</option>

<option value="hospital">Hospital</option>

</select>

<button type="submit">Share Data</button>

</form>

</div>


{% if message %}

<p class="success">{{ message }}</p>

<p class="success">Hash Key: {{ key }}</p>

{% endif %}


</body>
</html>
