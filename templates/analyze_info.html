<!DOCTYPE html>
<html>
<head>
<title>Analyze Information</title>
<link rel="stylesheet" href="{{ url_for('static', filename='research_style.css') }}">
</head>

<body class="research-bg">

<div class="topbar">
    <div class="logo">📊 MediBlock</div>
    <div class="logout"><a href="/research_home">Back</a></div>
</div>

<div class="container">

<h2 class="dashboard-title">Analyze Medical Information</h2>

<table class="styled-table">

<thead>
<tr>
<th>Patient ID</th>
<th>Disease</th>
<th>Treatment</th>
<th>Date</th>
</tr>
</thead>

<tbody>
{% for row in data %}
<tr>
<td>{{ row.patient_id }}</td>
<td>{{ row.disease }}</td>
<td>{{ row.treatment }}</td>
<td>{{ row.date }}</td>
</tr>
{% endfor %}
</tbody>

</table>

</div>

</body>
</html>
