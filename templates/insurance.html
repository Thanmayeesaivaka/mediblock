<!DOCTYPE html>
<html>
<head>
    <title>Insurance Verification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

<div class="nav">
    <h2>Insurance Verification</h2>
    <a href="/logout" class="logout">Logout</a>
</div>

<div class="card">
<h3>Record Authenticity:
{% if valid %}
<span class="valid">VERIFIED ✔</span>
{% else %}
<span class="invalid">REJECTED ❌ (Tampered)</span>
{% endif %}
</h3>
</div>

<div class="card">
<table>
<tr>
<th>ID</th>
<th>Patient</th>
<th>Doctor</th>
<th>Diagnosis</th>
<th>Date</th>
</tr>

{% for b in blocks %}
<tr>
<td>{{b.index}}</td>
<td>{{b.patient}}</td>
<td>{{b.doctor}}</td>
<td>{{b.diagnosis}}</td>
<td>{{b.timestamp}}</td>
</tr>
{% endfor %}

</table>
</div>

</div>
</body>
</html>
