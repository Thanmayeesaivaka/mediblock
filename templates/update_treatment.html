<!DOCTYPE html>
<html>
<head>
<title>Update Treatment</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="staff-bg">

<div class="topbar">
<div class="logo">🏥 MediBlock</div>

<div class="logout">
<a href="/doctor">Back</a>
</div>
</div>

<h2 class="dashboard-title">Update Treatment</h2>

<form method="POST"
style="width:40%;margin:auto;background:white;padding:30px;border-radius:10px">

<label>Patient ID</label><br>
<input type="text" name="patient" required><br><br>

<label>Diagnosis</label><br>
<textarea name="diagnosis" required></textarea><br><br>

<label>Prescription</label><br>
<textarea name="prescription" required></textarea><br><br>

<input type="submit" value="Update Treatment">

</form>

{% if message %}
<p style="text-align:center;color:green">{{ message }}</p>
{% endif %}

</body>
</html>
