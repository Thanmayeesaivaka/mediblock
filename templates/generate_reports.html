<!DOCTYPE html>
<html>
<head>

<title>Research Reports</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Segoe UI;
margin:0;
background:linear-gradient(135deg,#1e88e5,#ff9800);
}

.container{
width:80%;
margin:auto;
margin-top:50px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
text-align:center;
color:#0d47a1;
}

canvas{
margin-top:40px;
}

</style>

</head>

<body>

<div class="container">

<h2>Medical Data Analysis</h2>

<canvas id="pieChart"></canvas>

<canvas id="barChart"></canvas>

</div>


<script>

/* Jinja data passed from Flask */

var labels = JSON.parse('{{ labels | tojson }}');
var values = JSON.parse('{{ values | tojson }}');


/* PIE CHART */

new Chart(document.getElementById("pieChart"),{

type:"pie",

data:{
labels:labels,
datasets:[{
data:values,
backgroundColor:[
"#ff9800",
"#42a5f5",
"#66bb6a",
"#ef5350",
"#ab47bc"
]
}]
}

});


/* BAR CHART */

new Chart(document.getElementById("barChart"),{

type:"bar",

data:{
labels:labels,
datasets:[{
label:"Number of Cases",
data:values,
backgroundColor:"#ff9800"
}]
},

options:{
scales:{
y:{
beginAtZero:true
}
}
}

});

</script>

</body>
</html>
