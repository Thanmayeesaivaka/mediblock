<!DOCTYPE html>
<html>
<head>
    <title>Medical Reports</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body {
            margin: 0;
            font-family: 'Segoe UI';
            background: linear-gradient(135deg, #1e88e5, #ff9800);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            color: white;
            background: rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .logout a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 80%;
            margin: auto;
            margin-top: 40px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            color: #0d47a1;
        }

        .chart-box {
            margin-top: 30px;
        }

    </style>

</head>

<body>

<div class="topbar">
    <div class="logo">📊 MediBlock</div>
    <div class="logout"><a href="/research_home">Back</a></div>
</div>

<div class="container">

    <h2>Medical Data Analysis</h2>

    <div class="chart-box">
        <canvas id="pieChart"></canvas>
    </div>

    <div class="chart-box">
        <canvas id="barChart"></canvas>
    </div>

</div>

<script>

    // ✅ SAFE JINJA DATA PARSING
    var labels = JSON.parse('{{ labels | tojson }}');
    var values = JSON.parse('{{ values | tojson }}');

    // ✅ PIE CHART
    new Chart(document.getElementById("pieChart"), {
        type: "pie",
        data: {
            labels: labels,
            datasets: [{
                data: values,
                backgroundColor: [
                    "#ff9800",
                    "#42a5f5",
                    "#66bb6a",
                    "#ef5350",
                    "#ab47bc"
                ]
            }]
        }
    });

    // ✅ BAR CHART
    new Chart(document.getElementById("barChart"), {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Number of Cases",
                data: values,
                backgroundColor: "#42a5f5"
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

</script>

</body>
</html>
