<!DOCTYPE html>
<html>
<head>
<title>Medical Reports</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#1e88e5,#ff9800);
}

/* TOPBAR */
.topbar{
display:flex;
justify-content:space-between;
padding:15px 30px;
color:white;
background:rgba(0,0,0,0.2);
}

.logo{
font-size:20px;
font-weight:bold;
}

.logout a{
color:white;
text-decoration:none;
}

/* CARD */
.container{
width:70%;
margin:auto;
margin-top:40px;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
text-align:center;
}

/* TITLE */
h2{
color:#0d47a1;
margin-bottom:20px;
}

/* SMALL CHARTS */
.chart-wrapper{
display:flex;
justify-content:space-around;
flex-wrap:wrap;
}

.chart-box{
width:300px;   /* 🔥 SMALL SIZE */
height:300px;
margin:20px;
}

</style>
</head>

<body>

<div class="topbar">
<div class="logo">📊 MediBlock</div>
<div class="logout"><a href="/research_home">Back</a></div>
</div>

<div class="container">

<h2>Medical Data Analysis (Disease Based)</h2>

<div class="chart-wrapper">

<div class="chart-box">
<canvas id="pieChart"></canvas>
</div>

<div class="chart-box">
<canvas id="barChart"></canvas>
</div>

</div>

</div>

<script>

var labels = JSON.parse('{{ labels | tojson }}');
var values = JSON.parse('{{ values | tojson }}');

/* PIE */
new Chart(document.getElementById("pieChart"),{
type:"pie",
data:{
labels:labels,
datasets:[{
data:values,
backgroundColor:[
"#ff9800",
"#42a5f5",
"#66bb6a",
"#ef5350",
"#ab47bc"
]
}]
}
});

/* BAR */
new Chart(document.getElementById("barChart"),{
type:"bar",
data:{
labels:labels,
datasets:[{
label:"Cases",
data:values,
backgroundColor:"#42a5f5"
}]
},
options:{
responsive:true,
maintainAspectRatio:false,   /* 🔥 important for small size */
scales:{
y:{
beginAtZero:true
}
}
}
});

</script>

</body>
</html>
