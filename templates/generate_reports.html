<!DOCTYPE html>
<html>
<head>
<title>Medical Data Analysis</title>

<link rel="stylesheet" href="{{ url_for('static', filename='research_style.css') }}">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* CONTAINER */
.chart-container{
width:85%;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* TITLE */
.chart-title{
text-align:center;
color:#1a237e;
margin-bottom:30px;
}

/* GRID */
.chart-grid{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
}

/* EACH CHART BOX */
.chart-box{
width:280px;   /* ✅ SMALL SIZE */
height:280px;
}

/* CANVAS CONTROL */
canvas{
width:100% !important;
height:100% !important;
}

</style>

</head>

<body class="research-bg">

<div class="chart-container">

<h2 class="chart-title">Medical Data Analysis</h2>

<div class="chart-grid">

<!-- PIE -->
<div class="chart-box">
<canvas id="pieChart"></canvas>
</div>

<!-- BAR -->
<div class="chart-box">
<canvas id="barChart"></canvas>
</div>

<!-- DOUGHNUT -->
<div class="chart-box">
<canvas id="doughnutChart"></canvas>
</div>

</div>

</div>

<script>

var labels = {{ labels | default([]) | tojson | safe }};
var values = {{ values | default([]) | tojson | safe }};

/* COLORS */
var colors = ["#ff9800","#42a5f5","#66bb6a","#ef5350","#ab47bc"];

/* PIE CHART */
new Chart(document.getElementById("pieChart"),{
type:"pie",
data:{
labels:labels,
datasets:[{
data:values,
backgroundColor:colors
}]
}
});

/* BAR CHART */
new Chart(document.getElementById("barChart"),{
type:"bar",
data:{
labels:labels,
datasets:[{
label:"Disease Count",
data:values,
backgroundColor:colors
}]
},
options:{
plugins:{
legend:{display:false}
},
scales:{
y:{beginAtZero:true}
}
}
});

/* DOUGHNUT */
new Chart(document.getElementById("doughnutChart"),{
type:"doughnut",
data:{
labels:labels,
datasets:[{
data:values,
backgroundColor:colors
}]
}
});

</script>

</body>
</html>
