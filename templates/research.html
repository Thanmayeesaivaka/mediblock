<!DOCTYPE html>
<html>
<head>

<title>Research Analyst Dashboard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='research_style.css') }}">

<style>

/* TITLE */
.dashboard-title{
text-align:center;
color:#4a148c;
margin-top:40px;
}

/* CARD CONTAINER */
.card-container{
display:flex;
justify-content:center;
gap:40px;
margin-top:50px;
flex-wrap:wrap;
}

/* CARD */
.feature-card{
width:300px;
background:white;
padding:30px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
transition:0.3s;
}

.feature-card:hover{
transform:translateY(-10px);
}

/* ICON */
.feature-card img{
width:80px;
margin-bottom:20px;
}

/* TEXT */
.feature-card h3{
color:#6a1b9a;
margin-bottom:15px;
}

/* BUTTON */
.feature-card a{
display:inline-block;
padding:10px 20px;
background:#8e24aa;
color:white;
text-decoration:none;
border-radius:8px;
transition:0.3s;
}

.feature-card a:hover{
background:#6a1b9a;
}

</style>

</head>

<body class="research-bg">

<h2 class="dashboard-title">Research Analyst Dashboard</h2>

<div class="card-container">

<div class="feature-card">

<img src="https://cdn-icons-png.flaticon.com/512/2331/2331943.png">

<h3>Analyze Information</h3>

<a href="/analyze_info">Open</a>

</div>


<div class="feature-card">

<img src="https://cdn-icons-png.flaticon.com/512/942/942748.png">

<h3>Generate Reports</h3>

<a href="/generate_reports">Generate</a>

</div>


<div class="feature-card">

<img src="https://cdn-icons-png.flaticon.com/512/190/190411.png">

<h3>Submit Findings</h3>

<a href="/submit_findings">Submit</a>

</div>

</div>

</body>
</html>
